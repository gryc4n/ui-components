<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE-edge">
        <meta name="viewport" content="width=device-width, initial scale=1.0">
        <title>Avatar</title>
        <link rel="stylesheet" href="/src/styles/global.css">
        <link rel="stylesheet" href="/src/styles/variables.css">
        <link rel="stylesheet" href="../avatar-1/style.css">
    
    </head>
    <body>
        <h1 class="site-title">Avatars</h1>
        <p class="description">Simple, lightweight and customizable</p>
        <div class="avatar-container">
            <div class="shapes container">
                <h2 class="variant-title">Shapes</h2>
                <img class="avatar circle" src="/src/assets/icons/avatar-default-svgrepo-com.svg" alt="avatar-icon">
                <img class="avatar square" src="/src/assets/icons/avatar-default-svgrepo-com.svg" alt="avatar-icon">
                <img class="avatar rounded" src="/src/assets/icons/avatar-default-svgrepo-com.svg" alt="avatar-icon"> 
            </div>

            <div class="size container">
                <h2 class="variant-title">Size</h2>
                <img class="avatar s" src="/src/assets/icons/avatar-default-svgrepo-com.svg" alt="avatar-icon">
                <img class="avatar m" src="/src/assets/icons/avatar-default-svgrepo-com.svg" alt="avatar-icon">
                <img class="avatar l" src="/src/assets/icons/avatar-default-svgrepo-com.svg" alt="avatar-icon">
                <img class="avatar xl" src="/src/assets/icons/avatar-default-svgrepo-com.svg" alt="avatar-icon">

            </div>

            <div class="status-showcase container">
                <h2 class="variant-title">Status</h2>
                <div class="status-variant">
                    <img class="avatar" src="/src/assets/icons/avatar-default-svgrepo-com.svg" alt="avatar-icon">
                    <span class="status online"></span>
                </div>
                 <div class="status-variant">
                    <img class="avatar" src="/src/assets/icons/avatar-default-svgrepo-com.svg" alt="avatar-icon">
                    <span class="status dnd"></span>
                </div>
                <div class="status-variant">
                    <img class="avatar" src="/src/assets/icons/avatar-default-svgrepo-com.svg" alt="avatar-icon">
                    <span class="status brb"></span>
                </div>
                <div class="status-variant">
                    <img class="avatar" src="/src/assets/icons/avatar-default-svgrepo-com.svg" alt="avatar-icon">
                    <span class="status offline"></span>
                </div>
            </div>

        </div>

    </body>

</html>
