<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bar Chart</title>
        <link rel="stylesheet" href="/UI-components/src/styles/global.css">
        <link rel="stylesheet" href="/UI-components/src/styles/variables.css">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <div class="page-container">
            <header class="header">
                <div class="header-content">
                    <h1 class="site-title">Bar Chart</h1>
                    <p class="site-description">A collection of bar charts styles and variants</p>
                </div>
            </header>

            <main class="main-content">
                <button class="value-changer">Random Values</button>
                <div class="sidebars-containers">
                    <figure class="bar-chart">
                        <figcaption class="bar-chart-title">Bar Chart</figcaption>

                        <div class="bar-chart-bars">
                            <div class="bar">
                                <span class="bar-value">35</span>
                                <div class="bar-fill"></div>
                                <span class="bar-label">Label 1</span>
                            </div>
                            <div class="bar">
                                <span class="bar-value">67</span>
                                <div class="bar-fill"></div>
                                <span class="bar-label">Label 2</span>
                            </div>
                            <div class="bar">
                                <span class="bar-value">90</span>
                                <div class="bar-fill"></div>
                                <span class="bar-label">Label 3</span>
                            </div>
                                <div class="bar">
                                <span class="bar-value">45</span>
                                <div class="bar-fill"></div>
                                <span class="bar-label">Label 4</span>
                            </div>
                            <div class="bar">
                                <span class="bar-value">77</span>
                                <div class="bar-fill"></div>
                                <span class="bar-label">Label 5</span>
                            </div>
                            <div class="bar">
                                <span class="bar-value">150</span>
                                <div class="bar-fill"></div>
                                <span class="bar-label">Label 6</span>
                            </div>
                        </div>
                    </figure>

                </div>
            </main>

        </div>

        <script src="script.js"></script>
    </body>
</html>
