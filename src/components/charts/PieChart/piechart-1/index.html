<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pie Chart</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div class="header-content">
            <h1 class="site-title">Pie Chart</h1>
            <p class="site-description">
                A collection of pie chart styles and variants</p>
        </div>

        <button class="value-changer">Random Values</button>
    </header>

    <main class="charts">

        <figure class="pie-chart">

            <figcaption class="pie-chart-title">
                Pie Chart
            </figcaption>

            <div class="pie-chart-content">

                <div class="pie-chart-data">

                    <div class="pie-chart-item">
                        <span class="pie-chart-label">Label 1</span>
                        <span class="pie-chart-value">40</span>
                    </div>

                    <div class="pie-chart-item">
                        <span class="pie-chart-label">Label 2</span>
                        <span class="pie-chart-value">30</span>
                    </div>

                    <div class="pie-chart-item">
                        <span class="pie-chart-label">Label 3</span>
                        <span class="pie-chart-value">20</span>
                    </div>

                    <div class="pie-chart-item">
                        <span class="pie-chart-label">Label 4</span>
                        <span class="pie-chart-value">10</span>
                    </div>

                </div>

                <svg
                    class="pie-chart-graph"
                    viewBox="0 0 200 200"
                ></svg>

            </div>

        </figure>

    </main>

    <script src="script.js"></script>

</body>
</html>
